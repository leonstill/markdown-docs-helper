<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="preload">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Markdown 文档浏览器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b6bcb'/%3E%3Cpath d='M4.5 3.5h4l3 3v6h-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/viewer.css">
</head>
<body>

<header class="topbar">
  <button class="btn icon" id="toggleLeft" title="显示/隐藏左侧目录栏（快捷键 [ ）" aria-pressed="false" aria-controls="sidebar">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor"/></svg>
  </button>
  <div class="brand"><span class="logo" aria-hidden="true"></span><span id="brandTitle">文档浏览器</span> <span class="bs" id="brandSub"></span></div>
  <div class="grow"><div class="path" id="docPath"></div></div>
  <button class="btn icon" id="prevBtn" title="上一篇" aria-label="上一篇">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10.5 3 6 8l4.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn icon" id="nextBtn" title="下一篇" aria-label="下一篇">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 3 10 8l-4.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn icon" id="searchBtn" title="搜索全部文档" aria-label="搜索全部文档" aria-expanded="false" aria-controls="searchBar">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <button class="btn icon" id="printBtn" title="打印 / 导出 PDF" aria-label="打印 / 导出 PDF">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4.5 6V2.6h7V6M4.5 9.3h7v4.1h-7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><rect x="2" y="6" width="12" height="4.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12.2" cy="8" r=".7" fill="currentColor"/></svg>
  </button>
  <button class="btn icon" id="linkBtn" title="复制当前文档链接" aria-label="复制当前文档链接">
    <svg class="i-link" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="i-check" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 8.6 6.2 11.8 13 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn icon" id="themeBtn" title="切换深/浅色" aria-label="切换深/浅色主题">
    <svg class="i-sun" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn icon" id="toggleRight" title="显示/隐藏右侧目录栏（快捷键 ] ）" aria-pressed="true" aria-controls="tocPane">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><line x1="10" y1="2.5" x2="10" y2="13.5" stroke="currentColor"/></svg>
  </button>
</header>

<form class="searchbar" id="searchBar" role="search" autocomplete="off">
  <svg class="sb-mg" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  <input class="sb-input" id="topSearch" type="text" placeholder="搜索全部文档内容…（回车搜索 · Esc 收起）" aria-label="搜索内容" spellcheck="false">
  <button class="btn icon" type="button" id="topClear" title="清除" aria-label="清除输入内容">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button class="btn icon" type="submit" id="topGo" title="搜索" aria-label="搜索">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
</form>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="pane-h">
      <span class="pane-t" id="sidebarTitle">文档目录</span>
      <button class="pane-x" id="closeLeft" title="隐藏左侧目录栏" aria-label="隐藏左侧目录栏">✕</button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="search" type="search" placeholder="搜索文件名 / 全文…  ( / 聚焦 )" autocomplete="off" spellcheck="false">
    </div>
    <nav class="tree" id="tree"></nav>
    <div class="sidebar-foot" id="foot"></div>
  </aside>

  <main>
    <div class="w-edge l" id="wEdgeL" aria-hidden="true" title="拖动调整正文宽度（向两边对称，双击复原）"></div>
    <article class="article" id="article"></article>
    <div class="w-edge r" id="wEdgeR" aria-hidden="true" title="拖动调整正文宽度（向两边对称，双击复原）"></div>
  </main>

  <aside class="toc" id="tocPane">
    <div class="pane-h">
      <span class="pane-t" id="tocTitle">本篇目录</span>
      <button class="pane-x" id="closeRight" title="隐藏右侧目录栏" aria-label="隐藏右侧目录栏">✕</button>
    </div>
    <ul class="toc-list" id="tocList"></ul>
  </aside>
</div>

<div id="scrim"></div>

<!-- ==================================================================
     页面配置：对应工程根目录下 config.json 的内容。
     由 build-docs.mjs 写入，不要手工编辑这里的 JSON —— 请改 config.json。
     改完在 file:// 下重跑一次构建生效；http 实时模式下刷新页面即可生效。
     ================================================================== -->
<script id="viewer-config" type="application/json"></script>

<!-- ==================================================================
     文档数据快照。两个产物在这里分道扬镳：
       md-viewer.html（离线单文件）—— 写入全部文档正文，file:// 下直接可读
       index.html     （实时服务版）—— 置为 {}，每次刷新都去 fetch docs-index.json，
                                        留一份旧快照只会误导
     ================================================================== -->
<script id="docs-snapshot" type="application/json"></script>

<!-- ==================================================================
     思维导图引擎占位（vendor/markmap/*，MIT，见 vendor/markmap/README.md）。
     构建时由 build-docs.mjs 填进下面三个空块，两个产物填法不同：
       md-viewer.html —— 整段内联引擎源码（file:// 页面无法加载外部脚本）
       index.html     —— 换成 script 标签，src 指向 vendor/markmap/ 下的本地文件
     顺序不能改：d3 → markmap-lib → markmap-view（view 是 (this.markmap, d3) 形式的 IIFE）。
     ================================================================== -->
<script id="vendor-d3"></script>
<script id="vendor-markmap-lib"></script>
<script id="vendor-markmap-view"></script>

<!-- ==================================================================
     嵌入图表引擎占位（vendor/mermaid/mermaid.min.js，MIT，见 vendor/mermaid/README.md）。
     用来画 Markdown 里 ```mermaid 围栏的内容（stateDiagram-v2 / stateDiagram /
     flowchart / 时序图 / 类图 / 甘特图…）。填法与上面的 markmap 一样：
     离线版整段内联，实时版本地外链。
     config.json 里 mermaid.enabled = false 时这块留空并标 data-disabled="1"，
     页面里的 ```mermaid 围栏退回普通代码块显示。
      ================================================================== -->
<script id="vendor-mermaid"></script>

<script id="mindmap-core" src="assets/mindmap-core.js"></script>

<script id="mermaid-core" src="assets/mermaid-core.js"></script>

<script id="md-core" src="assets/md-core.js"></script>

<script id="md-app" src="assets/md-app.js"></script>
</body>
</html>
